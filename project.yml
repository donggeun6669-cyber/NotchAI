# Xcode project definition. Regenerate NotchAI.xcodeproj with: xcodegen generate
name: NotchAI
options:
  bundleIdPrefix: com.dongeun
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  NotchAI:
    type: application
    platform: macOS
    sources: [NotchAI]
    info:
      path: NotchAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: NotchAI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true            # no Dock icon, no menu bar; lives in the notch only
        NSAppleEventsUsageDescription: "지금 재생 중인 음악과 크롬에서 보고 있는 페이지를 읽기 위해 사용합니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAI
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the adapter script writes into the app bundle
    postBuildScripts:
      # System "Now Playing" helper (Vendor/mediaremote-adapter, BSD-3). Built with CMake and
      # copied into Contents/Resources/MediaRemoteAdapter; the app runs it through /usr/bin/perl.
      - name: Bundle MediaRemote adapter
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SRC="$SRCROOT/Vendor/mediaremote-adapter"
          OUT="$SRC/build"
          if ! command -v cmake >/dev/null; then
            echo "warning: cmake not found; building without the Now Playing adapter (brew install cmake)"
            exit 0
          fi
          cmake -S "$SRC" -B "$OUT" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$OUT" >/dev/null
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteAdapter"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$OUT/MediaRemoteAdapter.framework" "$DEST/"
          cp "$OUT/MediaRemoteAdapterTestClient" "$SRC/bin/mediaremote-adapter.pl" "$SRC/LICENSE" "$DEST/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/MediaRemoteAdapter.framework" "$DEST/MediaRemoteAdapterTestClient"
  NotchAITests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchAITests]
    dependencies:
      - target: NotchAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchAI:
    build:
      targets:
        NotchAI: all
        NotchAITests: [test]
    test:
      targets: [NotchAITests]
