# Xcode project definition. Regenerate NotchAI.xcodeproj with: xcodegen generate
name: NotchAI
options:
  bundleIdPrefix: com.dongeun
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  NotchAI:
    type: application
    platform: macOS
    sources: [NotchAI]
    info:
      path: NotchAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: NotchAI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true            # no Dock icon, no menu bar; lives in the notch only
        NSAppleEventsUsageDescription: "지금 재생 중인 음악과 크롬에서 보고 있는 페이지를 읽기 위해 사용합니다."
        NSMicrophoneUsageDescription: "강의실 등 주변 소리를 녹음하기 위해 사용합니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the adapter script writes into the app bundle
    postBuildScripts:
      # System "Now Playing" helper (Vendor/mediaremote-adapter, BSD-3). Built with CMake and
      # copied into Contents/Resources/MediaRemoteAdapter; the app runs it through /usr/bin/perl.
      - name: Bundle MediaRemote adapter
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SRC="$SRCROOT/Vendor/mediaremote-adapter"
          OUT="$SRC/build"
          if ! command -v cmake >/dev/null; then
            echo "warning: cmake not found; building without the Now Playing adapter (brew install cmake)"
            exit 0
          fi
          cmake -S "$SRC" -B "$OUT" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$OUT" >/dev/null
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteAdapter"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$OUT/MediaRemoteAdapter.framework" "$DEST/"
          cp "$OUT/MediaRemoteAdapterTestClient" "$SRC/bin/mediaremote-adapter.pl" "$SRC/LICENSE" "$DEST/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/MediaRemoteAdapter.framework" "$DEST/MediaRemoteAdapterTestClient"
  LectureRecorder:
    # "강의녹음": the recorder alone, as a menu bar app to hand to friends. Shares the recording
    # engine with NotchAI (the three files below) instead of copying it.
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - LectureRecorder
      - NotchAI/Services/RecorderService.swift
      - NotchAI/Services/AudioDevices.swift
      - NotchAI/Services/RecordingCheck.swift
      - NotchAI/Services/Transcriber.swift
    info:
      path: LectureRecorder/Resources/Info.plist
      properties:
        CFBundleName: 강의녹음
        CFBundleDisplayName: 강의녹음
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true            # menu bar only
        NSMicrophoneUsageDescription: "강의를 녹음하기 위해 마이크와 녹음 장치(BlackHole)를 사용합니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.LectureRecorder
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the whisper script copies from build/ into the bundle
    postBuildScripts:
      # On-device transcription: whisper-cli from scripts/build-whisper.sh, plus its MIT licence.
      - name: Bundle whisper-cli
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BIN="$SRCROOT/build/whisper/whisper-cli"
          if [ ! -x "$BIN" ]; then
            echo "warning: whisper-cli not built; run scripts/build-whisper.sh (transcription disabled)"
            exit 0
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$BIN" "$DEST/whisper-cli"
          cp "$SRCROOT/build/whisper/whisper-LICENSE" "$DEST/whisper-LICENSE.txt"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/whisper-cli"
  NotchAITests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchAITests]
    dependencies:
      - target: NotchAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchAI:
    build:
      targets:
        NotchAI: all
        NotchAITests: [test]
    test:
      targets: [NotchAITests]
  LectureRecorder:
    build:
      targets:
        LectureRecorder: all
