# Xcode project definition. Regenerate NotchAI.xcodeproj with: xcodegen generate
name: NotchAI
options:
  bundleIdPrefix: com.dongeun
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  NotchAI:
    type: application
    platform: macOS
    sources: [NotchAI]
    info:
      path: NotchAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: NotchAI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true            # no Dock icon, no menu bar; lives in the notch only
        NSAppleEventsUsageDescription: "지금 재생 중인 음악과 크롬에서 보고 있는 페이지를 읽기 위해 사용합니다."
        NSMicrophoneUsageDescription: "강의실 등 주변 소리를 녹음하기 위해 사용합니다."
        NSRemindersFullAccessUsageDescription: "노치 달력의 오늘 할 일을 미리 알림 「오늘 할 일」 목록에서 바로 읽습니다. 할 일은 이 맥 밖으로 나가지 않습니다."
        NSRemindersUsageDescription: "노치 달력의 오늘 할 일을 미리 알림 「오늘 할 일」 목록에서 바로 읽습니다. 할 일은 이 맥 밖으로 나가지 않습니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the adapter script writes into the app bundle
    postBuildScripts:
      # System "Now Playing" helper (Vendor/mediaremote-adapter, BSD-3). Built with CMake and
      # copied into Contents/Resources/MediaRemoteAdapter; the app runs it through /usr/bin/perl.
      - name: Bundle MediaRemote adapter
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SRC="$SRCROOT/Vendor/mediaremote-adapter"
          OUT="$SRC/build"
          if ! command -v cmake >/dev/null; then
            echo "warning: cmake not found; building without the Now Playing adapter (brew install cmake)"
            exit 0
          fi
          cmake -S "$SRC" -B "$OUT" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$OUT" >/dev/null
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteAdapter"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$OUT/MediaRemoteAdapter.framework" "$DEST/"
          cp "$OUT/MediaRemoteAdapterTestClient" "$SRC/bin/mediaremote-adapter.pl" "$SRC/LICENSE" "$DEST/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/MediaRemoteAdapter.framework" "$DEST/MediaRemoteAdapterTestClient"
  LectureRecorder:
    # "강의녹음": the recorder alone, as a menu bar app to hand to friends. Shares the recording
    # engine with NotchAI (the three files below) instead of copying it.
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - LectureRecorder
      - NotchAI/Services/RecorderService.swift
      - NotchAI/Services/AppPaths.swift
      - NotchAI/Services/AudioDevices.swift
      - NotchAI/Services/RecordingCheck.swift
      - NotchAI/Services/SystemAudioCapture.swift
      - NotchAI/Services/Transcriber.swift
    info:
      path: LectureRecorder/Resources/Info.plist
      properties:
        CFBundleName: 강의녹음
        CFBundleDisplayName: 강의녹음
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true            # menu bar only
        NSMicrophoneUsageDescription: "강의실에서 교수님 목소리를 녹음하기 위해 마이크를 사용합니다."
        NSAudioCaptureUsageDescription: "온라인 강의를 녹음하기 위해 맥에서 재생되는 소리를 사용합니다. 녹음은 이 맥에만 저장됩니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.LectureRecorder
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the whisper script copies from build/ into the bundle
    postBuildScripts:
      # On-device transcription: whisper-cli and its 5-bit model from scripts/build-whisper.sh,
      # plus the MIT licence. The model ships in the app so a friend downloads nothing.
      - name: Bundle whisper-cli
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BIN="$SRCROOT/build/whisper/whisper-cli"
          if [ ! -x "$BIN" ]; then
            echo "warning: whisper-cli not built; run scripts/build-whisper.sh (transcription disabled)"
            exit 0
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$BIN" "$DEST/whisper-cli"
          cp "$SRCROOT/build/whisper/whisper-LICENSE" "$DEST/whisper-LICENSE.txt"
          MODEL="$SRCROOT/build/whisper/models/ggml-large-v3-turbo-q5_0.bin"
          if [ -f "$MODEL" ]; then
            cp "$MODEL" "$DEST/"
          else
            echo "warning: bundled model missing; run scripts/build-whisper.sh (the app will offer the download)"
          fi
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/whisper-cli"
  NotchDesk:
    # The desk half of NotchAI for anyone (to sell): Calendar.app, the recorder with the built-in
    # tap and bundled transcription (as in 강의녹음), music, clipboard, shelf, timer, launcher.
    # No coding agents and nothing from DEAN. Shares NotchAI's notch, desk and recording code;
    # the files below are NotchAI's own and NotchDesk brings its versions in NotchDesk/.
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NotchAI
        excludes:
          - "App/**"
          - "Providers/**"
          - "Resources/**"
          - "Character/AICharacterView.swift"
          - "Character/CharacterAnimations.swift"
          - "Character/CharacterState.swift"
          - "Models/AIProvider.swift"
          - "Models/AgentOverview.swift"
          - "Models/AgentState.swift"
          - "Models/ChatSession.swift"
          - "Models/TaskActivity.swift"
          - "Notch/NotchView.swift"
          - "Services/AgentOverviewReader.swift"
          - "Services/ChromeService.swift"
          - "Services/ClaudeCodeMonitor.swift"
          - "Services/CodexMonitor.swift"
          - "Services/CodexStateReader.swift"
          - "Services/LauncherService+DEAN.swift"
          - "Services/ScheduleService.swift"
          - "Services/JarvisService.swift"
          - "Models/NotchFeatures.swift"
          - "Character/JarvisOrbView.swift"
          - "Views/JarvisPane.swift"
          - "Services/JarvisChat.swift"
          - "Services/JarvisApprovals.swift"
          - "Views/ApprovalSidePanel.swift"
          - "Views/AgentBadgesView.swift"
          - "Views/CollapsedNotchView.swift"
          - "Views/ExpandedNotchView.swift"
          - "Views/MoreMenu.swift"
      - path: NotchDesk
        excludes:
          - "Distribution/**"
    info:
      path: NotchDesk/Resources/Info.plist
      properties:
        CFBundleName: NotchDesk
        CFBundleDisplayName: NotchDesk
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true            # no Dock icon; lives in the notch
        LSApplicationCategoryType: public.app-category.productivity
        NotchDataFolder: NotchDesk
        NotchRecordingFolder: NotchDesk 녹음
        NSCalendarsFullAccessUsageDescription: "노치에 달력과 그날 일정을 보여 주기 위해 캘린더를 읽습니다. 일정은 이 맥 밖으로 나가지 않습니다."
        NSCalendarsUsageDescription: "노치에 달력과 그날 일정을 보여 주기 위해 캘린더를 읽습니다. 일정은 이 맥 밖으로 나가지 않습니다."
        NSMicrophoneUsageDescription: "강의실·회의실처럼 주변 소리를 녹음할 때 마이크를 사용합니다. 녹음은 이 맥에만 저장됩니다."
        NSAudioCaptureUsageDescription: "온라인 강의·회의를 녹음할 때 맥에서 재생되는 소리를 사용합니다. 녹음은 이 맥에만 저장됩니다."
        NSAppleEventsUsageDescription: "지금 재생 중인 음악(Music · Spotify · 크롬 탭)을 보여 주고 조작하기 위해 사용합니다."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchDesk
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # System "Now Playing" helper (Vendor/mediaremote-adapter, BSD-3). Built with CMake and
      # copied into Contents/Resources/MediaRemoteAdapter; the app runs it through /usr/bin/perl.
      - name: Bundle MediaRemote adapter
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SRC="$SRCROOT/Vendor/mediaremote-adapter"
          OUT="$SRC/build"
          if ! command -v cmake >/dev/null; then
            echo "warning: cmake not found; building without the Now Playing adapter (brew install cmake)"
            exit 0
          fi
          cmake -S "$SRC" -B "$OUT" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$OUT" >/dev/null
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteAdapter"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$OUT/MediaRemoteAdapter.framework" "$DEST/"
          cp "$OUT/MediaRemoteAdapterTestClient" "$SRC/bin/mediaremote-adapter.pl" "$SRC/LICENSE" "$DEST/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/MediaRemoteAdapter.framework" "$DEST/MediaRemoteAdapterTestClient"
      - name: Bundle whisper-cli
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BIN="$SRCROOT/build/whisper/whisper-cli"
          if [ ! -x "$BIN" ]; then
            echo "warning: whisper-cli not built; run scripts/build-whisper.sh (transcription disabled)"
            exit 0
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$BIN" "$DEST/whisper-cli"
          cp "$SRCROOT/build/whisper/whisper-LICENSE" "$DEST/whisper-LICENSE.txt"
          MODEL="$SRCROOT/build/whisper/models/ggml-large-v3-turbo-q5_0.bin"
          if [ -f "$MODEL" ]; then
            cp "$MODEL" "$DEST/"
          else
            echo "warning: bundled model missing; run scripts/build-whisper.sh (the app will offer the download)"
          fi
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/whisper-cli"
  NotchAITests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchAITests]
    dependencies:
      - target: NotchAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongeun.NotchAITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchAI:
    build:
      targets:
        NotchAI: all
        NotchAITests: [test]
    test:
      targets: [NotchAITests]
  LectureRecorder:
    build:
      targets:
        LectureRecorder: all
